<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="300">
      <stop offset="0%" stop-color="#1a2fd6"/>
      <stop offset="45%" stop-color="#7b2fe0"/>
      <stop offset="100%" stop-color="#e619a3"/>
    </linearGradient>
  </defs>

  <!-- large anchor tile -->
  <rect x="20" y="20" width="160" height="160" rx="24" fill="url(#grad)"/>

  <!-- top-right small tile: KPI dot -->
  <rect x="196" y="20" width="84" height="72" rx="18" fill="url(#grad)"/>
  <circle cx="238" cy="56" r="14" fill="#ffffff"/>

  <!-- right-middle small tile: ring/donut -->
  <rect x="196" y="108" width="84" height="72" rx="18" fill="url(#grad)"/>
  <circle cx="238" cy="144" r="14" fill="none" stroke="#ffffff" stroke-width="8"/>

  <!-- bottom wide tile: bar chart -->
  <rect x="20" y="196" width="260" height="84" rx="20" fill="url(#grad)"/>
  <g fill="#ffffff">
    <rect x="78" y="244" width="24" height="20" rx="4"/>
    <rect x="118" y="232" width="24" height="32" rx="4"/>
    <rect x="158" y="220" width="24" height="44" rx="4"/>
    <rect x="198" y="212" width="24" height="52" rx="4"/>
  </g>
</svg>
